services:
  api:
    image: dvld-api:local

    build:
      context: .
      dockerfile: backend/DVLD.Api/Dockerfile

    ports:
      - "127.0.0.1:5000:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"

      JwtSettings__SecretKey: "${JWT_SECRET:?Set JWT_SECRET in .env}"

      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=DVLD_DB;User Id=sa;Password=${SQL_PASSWORD:?Set SQL_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True"

    depends_on:
      db:
        condition: service_healthy

  db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: dvld-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${SQL_PASSWORD:?Set SQL_PASSWORD in .env}"

    ports:
      - "127.0.0.1:14330:1433"

    volumes:
      - sql-data:/var/opt/mssql

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd
          -S localhost
          -U sa
          -P "$$MSSQL_SA_PASSWORD"
          -C
          -Q "SELECT 1"
          -b
          -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  sql-data: