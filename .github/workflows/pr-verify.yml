name: PR Verify

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: pr-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            common: &common
              - 'shared/**'
              - '**/Directory.*.props'
              - 'global.json'
              - '.editorconfig'
              - '.github/actions/**'
              - '.github/workflows/pr-verify.yml'
            backend:
              - *common
              - 'backend/**'
              - 'tests/**'
            frontend:
              - *common
              - 'frontend/**'
              - 'tests/DVLD.WinForms*/**'
            workflows:
              - '.github/**'

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-dotnet

      - name: Restore
        run: dotnet restore backend/DVLD.Api/DVLD.Api.csproj

      - name: Code style
        run: dotnet format backend/DVLD.Api/DVLD.Api.csproj --verify-no-changes --no-restore -v detailed

      - name: Build
        run: dotnet build backend/DVLD.Api/DVLD.Api.csproj -c Release --no-restore

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/DVLD.Api/Dockerfile
          load: true
          tags: dvld-api:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha,scope=dvld-api

  frontend:
    name: Frontend (WinForms)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-dotnet

      - name: Restore
        run: dotnet restore frontend/DVLD.WinForms/DVLD.WinForms.csproj

      - name: Code style
        run: dotnet format frontend/DVLD.WinForms/DVLD.WinForms.csproj --verify-no-changes --no-restore

      - name: Build
        run: dotnet build frontend/DVLD.WinForms/DVLD.WinForms.csproj -c Release --no-restore


  workflows:
    name: Lint workflows
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color

  ci-gate:
    name: CI Gate
    if: always()
    needs: [changes, backend, frontend, workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Evaluate job results
        run: |
          echo "changes:   ${{ needs.changes.result }}"
          echo "backend:   ${{ needs.backend.result }}"
          echo "frontend:  ${{ needs.frontend.result }}"
          echo "workflows: ${{ needs.workflows.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::One or more verification jobs failed."
            exit 1
          fi
          echo "All required checks passed or were skipped."