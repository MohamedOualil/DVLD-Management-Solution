name: Publish Artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-artifacts-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            common: &common
              - 'shared/**'
              - '**/Directory.*.props'
              - 'global.json'
              - '.github/actions/**'
              - '.github/workflows/publish-artifacts.yml'
            backend:
              - *common
              - 'backend/**'
              - 'tests/**'
            frontend:
              - *common
              - 'frontend/**'

  backend-image:
    name: Backend image
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-dotnet

      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dvld-api" >> "$GITHUB_ENV"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=branch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/DVLD.Api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=dvld-api
          cache-to: type=gha,scope=dvld-api,mode=max

  frontend-build:
    name: WinForms build artifact
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-dotnet

      - name: Compute ref slug
        shell: pwsh
        run: |
          "REF_SLUG=$($env:GITHUB_REF_NAME -replace '/', '-')" >> $env:GITHUB_ENV

      - name: Publish client
        run: dotnet publish frontend/DVLD.WinForms/DVLD.WinForms.csproj -c Release -r win-x64 --self-contained false -o out/winforms

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dvld-winforms-${{ env.REF_SLUG }}-${{ github.sha }}
          path: out/winforms/
          retention-days: 14
          if-no-files-found: error